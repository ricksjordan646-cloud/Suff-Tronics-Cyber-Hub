name: Build SUFF-TRONICS Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project archive if zipped
        run: |
          echo "Current directory files:"
          ls -la
          
          # If the user uploaded the zip file directly to the repo
          if [ -f "SUFF_TRONICS_BUSINESS_MANAGER_Android_Project.zip" ]; then
            echo "Unzipping SUFF_TRONICS_BUSINESS_MANAGER_Android_Project.zip..."
            unzip -o "SUFF_TRONICS_BUSINESS_MANAGER_Android_Project.zip"
          fi
          
          # Check for any zip file in root
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "Extracting $f..."
              unzip -o "$f" || true
            fi
          done

          # If extracted into nested SUFF_TRONICS_BUSINESS_MANAGER folder
          if [ -d "SUFF_TRONICS_BUSINESS_MANAGER" ]; then
            echo "Copying files from nested folder to root..."
            cp -rn SUFF_TRONICS_BUSINESS_MANAGER/* . || true
          fi

          echo "Directory contents before building:"
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Gradle wrapper exists
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Creating gradle wrapper..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload SUFF-TRONICS APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SUFF-TRONICS-Business-Manager-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
